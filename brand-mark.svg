<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">BL07 Flow</title>
  <desc id="desc">A clean glowing zero seven wordmark.</desc>
  <defs>
    <linearGradient id="frame" x1="8" y1="5" x2="57" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#825783"/>
      <stop offset=".54" stop-color="#563557"/>
      <stop offset="1" stop-color="#241629"/>
    </linearGradient>
    <linearGradient id="digits" x1="17" y1="14" x2="49" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffaf4"/>
      <stop offset=".72" stop-color="#f4e7dc"/>
      <stop offset="1" stop-color="#d99873"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#160d19" flood-opacity=".38"/>
    </filter>
  </defs>
  <g filter="url(#iconShadow)">
    <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#frame)"/>
    <rect x="3" y="3" width="58" height="58" rx="17" fill="none" stroke="#fff" stroke-opacity=".12"/>
    <text x="32" y="44" text-anchor="middle" font-family="Lexend,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="-3" fill="url(#digits)">07</text>
  </g>
</svg>

