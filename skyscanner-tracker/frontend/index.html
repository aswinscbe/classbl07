<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Tracker</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --text: #e8e8ea; --muted: #9a9ea6;
    --accent: #4f8cff; --border: #2a2e37; --good: #3ecf8e; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding-bottom: 70px;
  }
  header { padding: 16px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; margin: 0; }
  main { padding: 12px; max-width: 720px; margin: 0 auto; }
  .tab { display: none; }
  .tab.active { display: block; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 15px;
  }
  button {
    padding: 10px 16px; border-radius: 8px; border: none; background: var(--accent);
    color: white; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 14px;
  }
  button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: 0.5; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin: 10px 0;
  }
  .flight-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .flight-row:last-child { border-bottom: none; }
  .flight-meta { font-size: 13px; color: var(--muted); }
  .price { font-weight: 700; color: var(--good); font-size: 16px; }
  a.book { font-size: 13px; color: var(--accent); text-decoration: none; }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .error { color: var(--bad); font-size: 13px; margin-top: 8px; }
  nav.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex;
    background: var(--card); border-top: 1px solid var(--border);
  }
  nav.tabbar button {
    flex: 1; margin: 0; border-radius: 0; background: transparent; color: var(--muted);
    padding: 14px 0; font-weight: 500;
  }
  nav.tabbar button.active { color: var(--accent); }
  .route-title { font-weight: 600; margin-bottom: 4px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: auto; }
  select { width: 100%; padding: 10px; border-radius: 8px; background: var(--card); color: var(--text); border: 1px solid var(--border); }
</style>
</head>
<body>
<header><h1>Flight Tracker</h1></header>
<main>

  <section id="tab-search" class="tab active">
    <label>From</label>
    <input id="origin" placeholder="e.g. Bangalore">
    <label>To</label>
    <input id="destination" placeholder="e.g. Barcelona">
    <label>Travel date</label>
    <input id="travelDate" type="date">
    <button id="searchBtn" onclick="doSearch()">Search</button>
    <div id="searchStatus" class="status"></div>
    <div id="searchResults"></div>
  </section>

  <section id="tab-history" class="tab">
    <div id="historyList"></div>
  </section>

  <section id="tab-compare" class="tab">
    <p class="status">Pick two or more searches from History (checkboxes) then come back here, or compare all.</p>
    <div id="compareList"></div>
    <button class="secondary" onclick="exportAll()">Export ALL history to Excel</button>
    <button class="secondary" onclick="exportSelected()">Export selected to Excel</button>
  </section>

</main>

<nav class="tabbar">
  <button id="nav-search" class="active" onclick="showTab('search')">Search</button>
  <button id="nav-history" onclick="showTab('history')">History</button>
  <button id="nav-compare" onclick="showTab('compare')">Compare</button>
</nav>

<script>
const API = "";
let selected = new Set();

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'history') loadHistory();
  if (name === 'compare') loadCompare();
}

async function doSearch() {
  const origin = document.getElementById('origin').value.trim();
  const destination = document.getElementById('destination').value.trim();
  const travel_date = document.getElementById('travelDate').value;
  const statusEl = document.getElementById('searchStatus');
  const resultsEl = document.getElementById('searchResults');
  const btn = document.getElementById('searchBtn');

  if (!origin || !destination || !travel_date) {
    statusEl.textContent = "Fill in from, to, and travel date.";
    return;
  }
  btn.disabled = true;
  statusEl.textContent = "Searching...";
  resultsEl.innerHTML = "";

  try {
    const res = await fetch(API + "/api/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ origin, destination, travel_date }),
    });
    const data = await res.json();
    if (!res.ok) {
      statusEl.innerHTML = `<span class="error">${data.detail || 'Search failed'}</span>`;
      btn.disabled = false;
      return;
    }
    statusEl.textContent = data.from_cache
      ? "Loaded from cache (searched recently)."
      : `Live results (${data.origin_resolved || origin} -> ${data.destination_resolved || destination})`;
    renderFlights(resultsEl, data.results);
  } catch (e) {
    statusEl.innerHTML = `<span class="error">${e}</span>`;
  }
  btn.disabled = false;
}

function renderFlights(container, flights) {
  if (!flights.length) {
    container.innerHTML = '<p class="status">No results.</p>';
    return;
  }
  const card = document.createElement('div');
  card.className = 'card';
  flights.forEach(f => {
    const row = document.createElement('div');
    row.className = 'flight-row';
    row.innerHTML = `
      <div>
        <div>${f.airline || 'Unknown airline'}</div>
        <div class="flight-meta">${f.depart_time || ''} - ${f.arrival_time || ''} | ${f.duration || ''} | ${f.stops === 0 ? 'Direct' : (f.stopover_airport || (f.stops + ' stop(s)'))}</div>
      </div>
      <div style="text-align:right">
        <div class="price">${f.price ? f.price + ' ' + (f.currency || '') : '-'}</div>
        ${f.booking_link ? `<a class="book" href="${f.booking_link}" target="_blank">Book</a>` : ''}
      </div>`;
    card.appendChild(row);
  });
  container.appendChild(card);
}

async function loadHistory() {
  const el = document.getElementById('historyList');
  el.innerHTML = "Loading...";
  const res = await fetch(API + "/api/history");
  const items = await res.json();
  if (!items.length) { el.innerHTML = '<p class="status">No searches yet.</p>'; return; }
  el.innerHTML = "";
  items.forEach(s => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="checkbox-row">
        <input type="checkbox" data-id="${s.id}" ${selected.has(s.id) ? 'checked' : ''}>
        <div>
          <div class="route-title">${s.origin_query} -> ${s.destination_query} (${s.travel_date})</div>
          <div class="flight-meta">Searched ${s.searched_at} | ${s.num_results} flights | from ${s.min_price ?? '-'}</div>
        </div>
      </div>`;
    card.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) selected.add(s.id); else selected.delete(s.id);
    });
    el.appendChild(card);
  });
}

async function loadCompare() {
  const el = document.getElementById('compareList');
  if (!selected.size) {
    el.innerHTML = '<p class="status">No searches selected yet - go to History and check some boxes.</p>';
    return;
  }
  el.innerHTML = "Loading...";
  const ids = Array.from(selected).join(',');
  const res = await fetch(API + "/api/compare?search_ids=" + ids);
  const items = await res.json();
  el.innerHTML = "";
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    const title = document.createElement('div');
    title.className = 'route-title';
    title.textContent = `${item.search.origin_query} -> ${item.search.destination_query} (${item.search.travel_date})`;
    card.appendChild(title);
    renderFlights(card, item.results);
    el.appendChild(card);
  });
}

function exportAll() {
  window.open(API + "/api/export", "_blank");
}
function exportSelected() {
  if (!selected.size) { alert("Select some searches in History first."); return; }
  window.open(API + "/api/export?search_ids=" + Array.from(selected).join(','), "_blank");
}

document.getElementById('travelDate').valueAsDate = new Date();
</script>
</body>
</html>
