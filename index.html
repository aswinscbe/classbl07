<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today · PGPBL07 Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fed">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <h1>Today</h1>
  <button class="iconBtn" id="themeToggle" aria-label="Toggle dark mode">◐</button>
</div>

<main class="page">
  <div id="focusSlot"></div>

  <div class="sectionLabel">Rest of today</div>
  <div class="card" id="todayList"><div class="empty">Loading…</div></div>

  <div class="sectionLabel">Quick tasks</div>
  <div class="card">
    <div id="quickTasks"><div class="empty">No tasks yet</div></div>
    <div class="addRow">
      <input type="text" id="quickTaskInput" placeholder="Add a task…">
      <button id="quickTaskAdd">Add</button>
    </div>
  </div>
</main>

<nav class="bottomNav">
  <a href="index.html" class="active"><span class="navIcon">●</span>Today</a>
  <a href="planner.html"><span class="navIcon">▤</span>Schedule</a>
  <a href="planner.html#calendar"><span class="navIcon">▦</span>Calendar</a>
  <a href="planner.html#tasks"><span class="navIcon">✓</span>Tasks</a>
  <a href="planner.html#profile"><span class="navIcon">◎</span>Profile</a>
</nav>

<script src="app.js"></script>
<script src="tasks.js"></script>
<script>
initTheme();
document.getElementById("themeToggle").addEventListener("click", toggleTheme);

let allClasses = [];
let profile = loadProfile();

async function boot() {
  if (!profile) {
    document.getElementById("focusSlot").innerHTML =
      `<div class="card"><p>Set up your profile to see your schedule.</p><a class="primaryBtn" href="planner.html#profile" style="display:block;text-align:center;box-sizing:border-box;">Go to Profile</a></div>`;
    document.getElementById("todayList").innerHTML = "";
    return;
  }
  const payload = await fetchSchedule();
  allClasses = personalClasses(payload.classes || [], profile);
  render();
  setInterval(render, 30000);
}

function render() {
  const today = todaysClasses(allClasses);
  const now = new Date();
  const ongoing = ongoingClass(today);
  const upNext = nextClass(today);

  const focusSlot = document.getElementById("focusSlot");
  if (ongoing) {
    const remaining = fmtCountdown(stamp(ongoing.date, ongoing.end) - now);
    focusSlot.innerHTML = `
      <div class="card focusCard">
        <span class="focusState"><span class="dot"></span>Happening now</span>
        <h2>${esc(ongoing.course)}</h2>
        <div class="focusMeta">${esc(ongoing.room)} · ${esc(ongoing.faculty)}</div>
        <div class="focusTime">
          <div><span class="label">Time</span><strong>${fmtTimeRange(ongoing)}</strong></div>
          <div><span class="label">Remaining</span><strong>${remaining}</strong></div>
        </div>
      </div>`;
  } else if (upNext && upNext.date === istKey()) {
    const until = fmtCountdown(stamp(upNext.date, upNext.start) - now);
    focusSlot.innerHTML = `
      <div class="card focusCard idle">
        <span class="focusState" style="color:var(--muted)"><span class="dot" style="background:var(--muted)"></span>Up next</span>
        <h2>${esc(upNext.course)}</h2>
        <div class="focusMeta">${esc(upNext.room)} · ${esc(upNext.faculty)}</div>
        <div class="focusTime">
          <div><span class="label">Starts</span><strong>${upNext.start}</strong></div>
          <div><span class="label">In</span><strong>${until}</strong></div>
        </div>
      </div>`;
  } else {
    focusSlot.innerHTML = `<div class="card focusCard idle"><p class="muted">No more classes today. Enjoy the free time.</p></div>`;
  }

  const remainingToday = today.filter((e) => stamp(e.date, e.end) > now);
  const listEl = document.getElementById("todayList");
  if (!remainingToday.length) {
    listEl.innerHTML = `<div class="empty">Nothing else scheduled today</div>`;
  } else {
    listEl.innerHTML = remainingToday
      .map((e) => {
        const isOngoing = ongoing && ongoing === e;
        return `
        <div class="eventRow ${e.status === "Cancelled" ? "cancelled" : ""}">
          <span class="eventDot" style="background:${subjectColor(e.baseCode || e.code)}"></span>
          <div class="eventBody">
            <div class="eventTitle">${esc(e.course)} ${isOngoing ? '<span class="pill">Live</span>' : ""}</div>
            <div class="eventMeta">${esc(e.room)}</div>
          </div>
          <div class="eventTime">${fmtTimeRange(e)}</div>
        </div>`;
      })
      .join("");
  }

  renderQuickTasks();
}

function renderQuickTasks() {
  const tasks = loadTasks().filter((t) => !t.done).slice(0, 5);
  const el = document.getElementById("quickTasks");
  el.innerHTML = tasks.length
    ? tasks.map((t) => `
      <div class="taskRow">
        <button class="taskCheck" data-id="${t.id}"></button>
        <span class="taskTitle">${esc(t.title)}</span>
      </div>`).join("")
    : `<div class="empty">No tasks yet</div>`;
  el.querySelectorAll(".taskCheck").forEach((btn) =>
    btn.addEventListener("click", () => { toggleTask(btn.dataset.id); renderQuickTasks(); })
  );
}

document.getElementById("quickTaskAdd").addEventListener("click", () => {
  const input = document.getElementById("quickTaskInput");
  if (!input.value.trim()) return;
  addTask(input.value.trim());
  input.value = "";
  renderQuickTasks();
});
document.getElementById("quickTaskInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("quickTaskAdd").click();
});

boot();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
